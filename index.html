<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de contatos</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <header>
        <img src="./images/agenda.png" alt="agenda">
        <h1>Agenda de contatos</h1>
    </header>
    <form id="form-contatos">
        <input type="text" id="nome-contato" require placeholder="Nome Contato">
        <input type="number" id="numero-contato" required placeholder="Número" minlength="10" maxlength="11">
        <button>Cadastrar</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>Nome do contato</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><span class="pessoa"></span>---</td>
                <td><span class="contato"></span>---</td>
            </tr>
        </tbody>
    </table>
</div>
<script src="./main.js"></script>
</body>
</html>
